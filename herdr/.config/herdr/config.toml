onboarding = false

[theme]
name = "terminal"  
auto_switch = false

[theme.custom]
accent      = "#ea9875"
panel_bg    = "#171311"
surface0    = "#201b19"
surface1    = "#2a2422"
surface_dim = "#0f0c0a"
overlay0    = "#73665b"
overlay1    = "#a09384"
text        = "#e6d5c2"
subtext0    = "#a09384"
mauve       = "#d1766e"
green       = "#99af6b"
yellow      = "#fcba81"
red         = "#d25780"
blue        = "#4e89a2"
teal        = "#20c9cb"
peach       = "#ea9875"

[keys]
### Prefix
prefix = "ctrl+space"

### Tabs
new_tab = "prefix+t"
close_tab = "prefix+w"
rename_tab = "prefix+n"
previous_tab = "prefix+`"
next_tab = "prefix+tab"
switch_tab = "prefix+1..9"

### Workspaces
new_workspace = "prefix+shift+t"
close_workspace = "prefix+shift+w"
rename_workspace = "prefix+shift+n"
next_workspace = "prefix+shift+tab"     
previous_workspace = "prefix+shift+`"   
switch_workspace = "prefix+shift+1..9"

### Pane Control
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = ["prefix+x","prefix+q"]
zoom = "prefix+z"        
resize_mode = "prefix+r"
toggle_sidebar = "prefix+e"

### Other
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+shift+q"
reload_config = "prefix+shift+r"
goto = "prefix+o"
remote_image_paste = "ctrl+v" 

 [[keys.command]]
 key = "prefix+up"
 type = "plugin_action"
 command = "cloudmanic.herdr-plus.projects"
 description = "herdr-plus: projects"

 [[keys.command]]
 key = "prefix+down"
 type = "plugin_action"
 command = "cloudmanic.herdr-plus.quick-actions"
 description = "herdr-plus: quick actions"

# herdr-lazy manage pane
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "herdr-lazy: manage plugins"

# herdr-splits.nvim — seamless navigation & resizing
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "herdr-splits: navigate left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "herdr-splits: navigate down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "herdr-splits: navigate up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "herdr-splits: navigate right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "herdr-splits: resize left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "herdr-splits: resize down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "herdr-splits: resize up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "herdr-splits: resize right"

# herdr-file-viewer
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

# herdr-reviewr
[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr pane"

[[keys.command]]              # lazygit: open in a split
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"

[[keys.command]]              # lazygit: open in its own tab
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"
