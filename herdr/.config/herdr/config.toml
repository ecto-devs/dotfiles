onboarding = false

[theme]
name = "terminal"   # neutral base; every token below is overridden by cendre
auto_switch = false

[theme.custom]
accent      = "#ea9875"
panel_bg    = "#171311"
surface0    = "#201b19"
surface1    = "#2a2422"
surface_dim = "#0f0c0a"
overlay0    = "#73665b"
overlay1    = "#a09384"
text        = "#e6d5c2"
subtext0    = "#a09384"
mauve       = "#d1766e"
green       = "#99af6b"
yellow      = "#fcba81"
red         = "#d25780"
blue        = "#4e89a2"
teal        = "#20c9cb"
peach       = "#ea9875"

[keys]
prefix = "ctrl+space"
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+o"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
next_workspace = "prefix+shift+tab"     # optional, unset by default
remote_image_paste = "ctrl+v" # only active in herdr --remote; empty disables raw-key image paste
new_tab = "prefix+t"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+`"
next_tab = "prefix+tab"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
close_tab = "prefix+shift+x"
rename_pane = "prefix+shift+p"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"       # legacy alias: fullscreen
resize_mode = "prefix+r"
toggle_sidebar = "prefix+e"

 [[keys.command]]
 key = "prefix+up"
 type = "plugin_action"
 command = "cloudmanic.herdr-plus.projects"
 description = "herdr-plus: projects"

 [[keys.command]]
 key = "prefix+down"
 type = "plugin_action"
 command = "cloudmanic.herdr-plus.quick-actions"
 description = "herdr-plus: quick actions"

# herdr-splits.nvim — seamless navigation & resizing
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "herdr-splits: navigate left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "herdr-splits: navigate down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "herdr-splits: navigate up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "herdr-splits: navigate right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "herdr-splits: resize left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "herdr-splits: resize down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "herdr-splits: resize up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "herdr-splits: resize right"

